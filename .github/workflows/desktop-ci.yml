name: Desktop checks and Windows development installer
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', '.env.example']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', '.env.example']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meldiq-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:acceptance-config
      - run: npm run matrix:check
      - name: Check fail-closed signature policy
        shell: pwsh
        run: ./scripts/windows-signature-policy.test.ps1
      - run: npm run test:web
      - run: npm run verify:snapshot
      - run: npm run build
      - run: npm run test:security
      - run: npm run test:smoke
      - name: Package standalone unsigned development installer
        run: npx electron-builder --config desktop/builder.dev.cjs --win nsis --x64 --publish never
      - name: Record development artifact checksums
        run: node scripts/release-manifest.mjs
      - name: Inspect packaged application dependencies and secrets
        run: node scripts/inspect-asar.mjs
      - name: Install, launch and uninstall the development installer
        shell: pwsh
        run: ./scripts/windows-install-smoke.ps1
      - name: Verify public production contracts from Windows Electron
        shell: pwsh
        run: |
          $acceptanceFile = Join-Path $env:RUNNER_TEMP 'desktop-acceptance.env'
          Copy-Item config/desktop-acceptance.env.example $acceptanceFile
          try { node scripts/acceptance-desktop.mjs --env $acceptanceFile; if ($LASTEXITCODE -ne 0) { throw 'Windows public contract acceptance failed; inspect the redacted report' } }
          finally { Remove-Item -LiteralPath $acceptanceFile -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Meldiq-Windows-x64-UNSIGNED-DEV
          path: |
            release/*.exe
            release/*.blockmap
            release/checksums.sha256
            release/build-manifest.json
            test-results/
          if-no-files-found: warn
          retention-days: 14
