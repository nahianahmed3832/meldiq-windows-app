name: Windows published-version upgrade qualification
on:
  push:
    branches: [codex/windows-production-readiness-20261103]
    paths: [.github/workflows/desktop-upgrade-check.yml, scripts/windows-upgrade-smoke.ps1]
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful Desktop checks run containing the development installer
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download only the qualified development artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run || '41659959939' }}
        run: |
          if ($env:CANDIDATE_RUN -notmatch '^[1-9][0-9]+$') { throw 'Invalid candidate run ID' }
          $run = gh run view $env:CANDIDATE_RUN --json conclusion,headSha | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success') { throw 'Candidate checks must have passed' }
          gh run download $env:CANDIDATE_RUN --name Meldiq-Windows-x64-UNSIGNED-DEV --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'Candidate artifact download failed' }
          $run | ConvertTo-Json | Set-Content candidate-source.json
      - name: Install old version, upgrade, verify branding, uninstall and reinstall
        shell: pwsh
        run: ./scripts/windows-upgrade-smoke.ps1 -CandidateDirectory candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Meldiq-published-version-upgrade-evidence
          path: |
            test-results/windows-upgrade.json
            candidate-source.json
          if-no-files-found: warn
          retention-days: 30
