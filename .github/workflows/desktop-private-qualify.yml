name: Qualify private-key automatic Windows updates
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Candidate preparation run with locally signed qualification feeds
        required: true
        type: string
permissions:
  contents: write
jobs:
  qualify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Exercise installed Windows updates over the actual HTTPS feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MELDIQ_CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: ./scripts/windows-private-update-qualification.ps1 -CandidateRun $env:MELDIQ_CANDIDATE_RUN
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: private-update-qualification
          path: |
            test-results/
          retention-days: 30
