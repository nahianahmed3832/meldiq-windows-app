name: Signed Windows release candidate
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [beta, canary, stable]
        default: beta
        required: true
permissions:
  contents: read
jobs:
  package:
    environment: desktop-release
    runs-on: windows-latest
    env:
      BUILD_DISTRIBUTION: direct
      BUILD_CHANNEL: ${{ inputs.channel }}
      MELDIQ_RELEASE_APPROVED: ${{ vars.MELDIQ_RELEASE_APPROVED }}
      MELDIQ_SIGNING_PUBLISHER: ${{ vars.MELDIQ_SIGNING_PUBLISHER }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      MELDIQ_RELEASE_ACCEPTANCE_JSON: ${{ secrets.MELDIQ_RELEASE_ACCEPTANCE_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Load external acceptance evidence for this exact commit
        run: node -e "const fs=require('fs'); if(!process.env.MELDIQ_RELEASE_ACCEPTANCE_JSON) throw Error('Missing acceptance evidence'); fs.writeFileSync('docs/desktop/RELEASE_ACCEPTANCE.json', process.env.MELDIQ_RELEASE_ACCEPTANCE_JSON);"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:acceptance-config
      - run: npm run matrix:check
      - name: Check fail-closed signature policy
        shell: pwsh
        run: ./scripts/windows-signature-policy.test.ps1
      - run: npm run test:web
      - run: npm run verify:snapshot
      - run: npm run package:win
      - name: Verify Authenticode on every executable
        shell: pwsh
        run: ./scripts/verify-windows-signatures.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Meldiq-signed-${{ inputs.channel }}
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/checksums.sha256
            release/build-manifest.json
          retention-days: 30
      # Promotion to S3/CDN is a separate authorized action after install/upgrade/update acceptance.
