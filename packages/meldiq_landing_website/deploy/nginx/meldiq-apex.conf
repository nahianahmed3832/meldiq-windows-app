# meldiq.app and www.meldiq.app: Meldiq's public website (VPS /etc/nginx/sites-available/meldiq-apex.conf).
# 2026-10-27: port 80 block (another session). 2026-10-28: behind Cloudflare, with a certificate and a 443 block; then the
# website itself instead of a redirect to Meldiq Web (owner, 2026-10-28). Report: docs/CLOUDFLARE_INTEGRATION_REPORT_2026-10-28.md.
#
# The site is the static export of meldiq_landing_website (`npm run build` → out/), installed as
# /opt/meldiq-site/releases/<release>/ with /opt/meldiq-site/current pointing at the live one. Until the first real
# release, `current` is a one-page placeholder (deploy/meldiq-site-placeholder/).
#
# Cloudflare redirects at the edge, before nginx: /invite/… and /m/… on both names → web.meldiq.app (links the apps
# already made), and www → meldiq.app. The same redirects are here for requests that reach nginx anyway.
# Answered here, never redirected: ACME HTTP-01 (certbot webroot /var/www/griip-message-acme) and the Android App Links
# file /.well-known/assetlinks.json (Android doesn't follow redirects), answered by the API.
# /v2/ (2026-10-28, the site's first release): the account API for the site's sign-in, account and billing pages, on
# the same origin (no CORS, no token in a URL), proxied to the API like web.meldiq.app's. Only /v2: the site never uses
# /v1 or the WebSocket. Requests are small JSON, so bodies are capped at 64 KB (Stripe webhooks go to the API's host).

server {
    listen 80;
    listen [::]:80;
    server_name meldiq.app www.meldiq.app;
    include /etc/nginx/snippets/meldiq-cloudflare-realip.conf;  # visitor address behind Cloudflare
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/griip-message-acme;
        default_type text/plain;
    }
    location = /.well-known/assetlinks.json {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host msg.meldiq.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    # `listen … http2` rather than `http2 on;`: the VPS runs nginx 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meldiq.app www.meldiq.app;
    include /etc/nginx/snippets/meldiq-cloudflare-realip.conf;  # visitor address behind Cloudflare

    ssl_certificate /etc/letsencrypt/live/meldiq.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meldiq.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/meldiq-apex.access.log;
    error_log /var/log/nginx/meldiq-apex.error.log warn;

    root /opt/meldiq-site/current;
    index index.html;

    # One canonical name.
    if ($host = www.meldiq.app) { set $meldiq_site_www 1; }
    if ($request_uri ~ "^/\.well-known/") { set $meldiq_site_www 0; }
    if ($meldiq_site_www = 1) { return 308 https://meldiq.app$request_uri; }

    location = /.well-known/assetlinks.json {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host msg.meldiq.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Contains only completed minute aggregates for allowlisted API routes.
    location = /.well-known/meldiq-performance.json {
        limit_except GET { deny all; }
        alias /var/lib/meldiq-performance/metrics.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    # Invitation and message links the apps have made: opened in Meldiq Web (or the app, through App Links).
    location ^~ /invite/ { return 308 https://web.meldiq.app$request_uri; }
    location ^~ /m/ { return 308 https://web.meldiq.app$request_uri; }

    # The account API for the site's own pages (same origin). Answers carry the API's headers, never cached.
    location ^~ /v2/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 64k;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Content-hashed build files: cached for a year.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Immutable Windows installers and authenticated metadata, independent of website releases.
    location ^~ /downloads/windows/ {
        alias /opt/meldiq-desktop/downloads/windows/;
        autoindex off;
        limit_except GET { deny all; }
        types { application/octet-stream exe; application/json json; text/plain sha256; }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ^~ /desktop-updates/ {
        alias /opt/meldiq-desktop/updates/;
        autoindex off;
        limit_except GET { deny all; }
        types { application/json json; }
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # A static export: /pricing is pricing.html; unknown paths get the site's own 404 page.
        try_files $uri $uri.html $uri/index.html =404;
    }
    error_page 404 /404.html;
}
